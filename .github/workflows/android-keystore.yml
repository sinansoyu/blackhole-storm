# Creates the upload key that signs the Android app. Run ONCE.
# Before running: add the repository secret ANDROID_KEYSTORE_PASSWORD (at least 8 characters).
# Afterwards: download the artifact, copy the text inside into the secret ANDROID_KEYSTORE_B64,
# keep a copy of the file somewhere safe, then delete the artifact/run.
name: Android imza anahtarı oluştur (bir kez)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Anahtarı üret
        env:
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ ${#PASS} -lt 8 ]; then echo "::error::Önce en az 8 karakterlik ANDROID_KEYSTORE_PASSWORD secret'ını ekle."; exit 1; fi
          keytool -genkeypair -keystore android.keystore -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Lias Labs, O=Lias Labs, C=TR"
          base64 -w0 android.keystore > ANDROID_KEYSTORE_B64.txt
          echo "### Yükleme anahtarı parmak izi (SHA-256)" >> "$GITHUB_STEP_SUMMARY"
          keytool -list -v -keystore android.keystore -alias upload -storepass "$PASS" | grep 'SHA256:' | sed 's/.*SHA256: //' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: android-keystore-GIZLI
          path: |
            android.keystore
            ANDROID_KEYSTORE_B64.txt
          retention-days: 1
